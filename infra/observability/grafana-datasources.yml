# Provisioned so a fresh Grafana container is useful immediately rather than
# after ten minutes of clicking — the friction is the reason local dashboards
# get abandoned.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
