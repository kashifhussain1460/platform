# V-AEP local infrastructure. Runs infra only — apps run on the host in dev.
#   docker compose -f infra/docker-compose.yml up -d
name: vaep

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaep}
      POSTGRES_DB: ${POSTGRES_DB:-vaep}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaep} -d ${POSTGRES_DB:-vaep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ── Observability ─────────────────────────────────────────────────────────
  # WAVE 9 recorded two ❌: "no OpenTelemetry anywhere" and "endpoints exist,
  # nothing scrapes them". Both were blocked on infrastructure rather than code,
  # and that infrastructure is three containers. They are opt-in via a profile —
  # someone running the app does not need a metrics stack:
  #   docker compose -f infra/docker-compose.yml --profile observability up -d
  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP — this is OTEL_EXPORTER_OTLP_ENDPOINT

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    # host.docker.internal: the API runs on the HOST in dev, not in this network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # Local only. Anonymous admin is fine for a throwaway container on
      # localhost and is NOT a pattern to copy anywhere a network can reach.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
