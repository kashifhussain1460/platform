name: Web CI

# Runs on PULL REQUESTS and on demand -- NOT on push to master.
#
# Pushing to master triggers deploy.yml, which runs lint, typecheck and the
# full test suite itself before it will deploy. Leaving `push` on here as well
# meant every push ran the API e2e suite THREE times (twice via this file's
# engine matrix, once via deploy.yml) for one deployable commit.
#
# The deploy pipeline is the gate that matters; this file is the fast feedback
# loop for a branch that has not merged yet.
on:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vaep/types build
      - run: pnpm --filter @vaep/web run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck --filter=@vaep/web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web unit tests
        working-directory: apps/web
        run: pnpm run test
